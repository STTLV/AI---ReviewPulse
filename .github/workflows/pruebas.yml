name: Pruebas ReviewPulse

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verificar modelo y estructura
        run: python verificar_proyecto.py
      - name: Ejecutar pruebas del agente
        run: python -m unittest discover -s tests -v
      - name: Ejecutar pruebas del experimento de quejas
        run: python -m unittest discover -s experimentos/paso8/tests -v
      - name: Ejecutar pruebas de umbrales
        run: python -m unittest discover -s experimentos/paso9/tests -v
